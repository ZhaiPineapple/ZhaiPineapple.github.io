<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>菠萝跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            background: #111;
            overflow: hidden;
        }
        canvas {
            background: #87CEEB;
            display: block;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 360;
canvas.height = 640;

const keys = {
    left: false,
    right: false,
    jump: false,
    duck: false
};

const player = {
    x: 130,
    y: 480,
    w: 60,
    h: 70,
    speedX: 6,
    vy: 0,
    jumpPower: -16,
    gravity: 0.7,
    onGround: true,
    hp: 5,
    maxHp: 5,
    duck: false,
    hurtCD: 0
};

const lanes = [60, 130, 200];
let currentLane = 1;

let turrets = [];
let lasers = [];

let groundOffset = 0;
const groundSpeed = 4;
let score = 0;
let gameOver = false;

function drawBackground() {
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#42a5f5';
    ctx.fillRect(0,550,canvas.width,90);
    ctx.fillStyle = '#ffdf91';
    ctx.fillRect(0,510,canvas.width,40);
    ctx.fillStyle = '#ffffff';
    groundOffset += groundSpeed;
    if(groundOffset > 40) groundOffset = 0;
    for(let i=0;i<4;i++){
        ctx.fillRect(115, groundOffset + i*120,6,30);
        ctx.fillRect(185, groundOffset + i*120,6,30);
    }
}

function drawPlayer(){
    ctx.save();
    let ph = player.duck ? player.h * 0.55 : player.h;
    let py = player.duck ? player.y + player.h*0.45 : player.y;
    ctx.fillStyle='#ffcc00';
    ctx.beginPath();
    ctx.roundRect(player.x, py, player.w, ph,12);
    ctx.fill();
    ctx.fillStyle='#38a838';
    ctx.beginPath();
    ctx.ellipse(player.x+30, py-8,22,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(player.x+18,py+22,5,0,Math.PI*2);
    ctx.arc(player.x+42,py+22,5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function spawnTurret(){
    if(Math.random()<0.008 && turrets.length < 3){
        let lane = Math.floor(Math.random()*3);
        turrets.push({
            x: lanes[lane],
            y: -80,
            w:55,
            h:55,
            shootTimer:0
        })
    }
}

function drawTurrets(){
    turrets.forEach(t=>{
        ctx.fillStyle="#555";
        ctx.fillRect(t.x,t.y,t.w,t.h);
        ctx.fillStyle="#ff3333";
        ctx.fillRect(t.x+20,t.y+15,15,25);
    })
}

function updateLasers(){
    lasers.forEach((l,i)=>{
        l.y +=9;
        if(checkCollision(l,player)){
            if(player.hurtCD <=0){
                player.hp--;
                player.hurtCD = 60;
                if(player.hp <=0) gameOver=true;
            }
        }
        if(l.y>canvas.height) lasers.splice(i,1);
    })
}
function drawLasers(){
    ctx.fillStyle="#ff2222";
    lasers.forEach(l=>{
        ctx.fillRect(l.x,l.y,l.w,l.h);
    })
}
    
function checkCollision(a,b){
    let ah = b.duck ? b.h*0.55 : b.h;
    let ay = b.duck ? b.y + b.h*0.45 : b.y;
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < ay+ah && a.y+a.h > ay;
}

function update(){
    if(gameOver) return;
    score += 0.1;
    if(player.hurtCD>0) player.hurtCD--;

    player.duck = keys.duck && player.onGround;

    if(keys.left && currentLane>0){
        currentLane--;
        keys.left=false;
    }
    if(keys.right && currentLane<2){
        currentLane++;
        keys.right=false;
    }
    player.x = lanes[currentLane];

    if(keys.jump && player.onGround){
        player.vy = player.jumpPower;
        player.onGround = false;
        keys.jump = false;
    }
    player.vy += player.gravity;
    player.y += player.vy;

    if(player.y >= 480){
        player.y = 480;
        player.vy = 0;
        player.onGround = true;
    }

    spawnTurret();
    turrets.forEach((t,idx)=>{
        t.y += groundSpeed;
        t.shootTimer++;
  if(t.shootTimer>90){
            lasers.push({
                x:t.x+22,
                y:t.y+50,
                w:10,
                h:35
            })
            t.shootTimer=0;
        }
        if(t.y>canvas.height) turrets.splice(idx,1);
    })
    updateLasers();
}

function drawUI(){
    ctx.fillStyle="#fff";
    ctx.font="18px Arial";
    ctx.fillText("生命：",10,28);
    ctx.fillStyle="#ff4444";
    for(let i=0;i<player.hp;i++){
        ctx.fillRect(65+i*22,12,18,16);
    }
    ctx.fillStyle="#fff";
    ctx.fillText(`分数：${Math.floor(score)}`,220,28);

    if(gameOver){
        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#fff";
        ctx.font="32px Arial";
        ctx.textAlign="center";
        ctx.fillText("游戏结束",canvas.width/2,260);
        ctx.fillText(`最终分数:${Math.floor(score)}`,canvas.width/2,310);
        ctx.font="18px Arial";
        ctx.fillText("刷新页面重新开始",canvas.width/2,360);
        ctx.textAlign="left";
    }
}

function loop(){
    update();
    drawBackground();
    drawTurrets();
    drawLasers();
    drawPlayer();
    drawUI();
    requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
    if(e.key === "ArrowLeft") keys.left=true;
    if(e.key === "ArrowRight") keys.right=true;
    if(e.key === "ArrowUp") keys.jump=true;
    if(e.key === "ArrowDown") keys.duck=true;
})
document.addEventListener('keyup',e=>{
    if(e.key === "ArrowDown") keys.duck=false;
})

let touchStartX=0;
canvas.addEventListener('touchstart',e=>{
    touchStartX = e.touches[0].clientX;
});
canvas.addEventListener('touchend',e=>{
    const endX = e.changedTouches[0].clientX;
    const dx = endX-touchStartX;
    if(Math.abs(dx)<25){
        keys.jump=true; 
    }else if(dx < -30){
        keys.left=true;
    }else if(dx>30){
        keys.right=true;
    }
})
canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches[0].clientY>520){
        keys.duck=true;
    }else{
        keys.duck=false;
    }
})

loop();
</script>
</body>
</html>
