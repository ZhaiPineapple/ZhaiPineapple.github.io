    <style>
        :root {
            --primary-color: #FFD700; /* 活力黄 */
            --secondary-color: #FFFFFF; /* 纯净白 */
            --accent-color: #FF6B6B; /* 游戏按钮红 */
            --dark-color: #333333; /* 深灰文本 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: var(--secondary-color);
            scroll-behavior: smooth;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--dark-color);
        }

        /* 加载动画 */
        .loader-wrapper {
            position: fixed;
    top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, transform 1s ease;
        }

        .loader-content {
            text-align: center;
            position: relative;
        }

        .sun-loader {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }
        
   .sun-loader .core {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.5s infinite;
            z-index: 2;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .sun-loader .ray {
            width: 10px;
            height: 35px;
            background: var(--primary-color);
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: 50% 100%;
            border-radius: 5px;
            animation: rotate 6s linear infinite;
            z-index: 1;
            }
        .sun-loader .ray:nth-child(2) { transform: translateX(-50%) rotate(45deg); }
        .sun-loader .ray:nth-child(3) { transform: translateX(-50%) rotate(90deg); }
        .sun-loader .ray:nth-child(4) { transform: translateX(-50%) rotate(135deg); }
        .sun-loader .ray:nth-child(5) { transform: translateX(-50%) rotate(180deg); }
        .sun-loader .ray:nth-child(6) { transform: translateX(-50%) rotate(225deg); }
        .sun-loader .ray:nth-child(7) { transform: translateX(-50%) rotate(270deg); }
        .sun-loader .ray:nth-child(8) { transform: translateX(-50%) rotate(315deg); }

        .text-loader {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: bold;
            display: flex;
            justify-content: center;
            }
        
 .text-loader span {
            display: inline-block;
            animation: bounce 0.8s infinite alternate;
            min-width: 20px;
            text-align: center;
        }

        .text-loader span:nth-child(1) { animation-delay: 0s; }
        .text-loader span:nth-child(2) { animation-delay: 0.1s; }
        .text-loader span:nth-child(3) { animation-delay: 0.2s; }
        .text-loader span:nth-child(4) { animation-delay: 0.3s; }
        .text-loader span:nth-child(5) { animation-delay: 0.4s; }
        .text-loader span:nth-child(6) { animation-delay: 0.5s; }

        .loader-hidden {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }
nav {
            background-color: rgba(255, 215, 0, 0.95);
            padding: 1rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            transition: all 0.4s ease;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        nav.scrolled {

        }

        nav ul {

            justify-content: center;

        }
nav a {

        .services-grid {

        .contact-icon {

        .contact-icon:hover {

        .contact-icon a {

        .contact-icon i {

                }
        .game-button {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            cursor: pointer;
            z-index: 99;
            transition: all 0.4s ease;
            animation: pulse 2s infinite;
        }

        .game-button:hover {
            transform: scale(1.15) rotate(15deg);
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.6);
            animation: none;
        }

        .game-button:active {
            transform: scale(0.9);
        }

        .game-button i {
            font-size: 2.2rem;
            color: white;
                             }
        .button-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            width: 100%;
            height: 100%;
            animation: ripple 2s infinite;
            opacity: 0;
        }

        .button-ripple:nth-child(2) {
            animation-delay: 0.5s;
        }

        .button-ripple:nth-child(3) {
            animation-delay: 1s;
        }
 @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(0.9); }
        }

        @keyframes rotate {
            to { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes bounce {
            to { transform: translateY(-20px); }
            }
        @media (max-width: 992px) {

    <script>
        // 页面加载完成后执行
        window.addEventListener('load', function() {
            const loader = document.querySelector('.loader-wrapper');
            
            // 显示加载动画至少1.5秒
            setTimeout(function() {
                loader.classList.add('loader-hidden');
                loader.addEventListener('transitionend', function() {
                    if (loader.classList.contains('loader-hidden')) {
                        loader.style.display = 'none';
                    }
                }, { once: true });
                
                // 初始化滚动观察
                const sections = document.querySelectorAll('section');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1 });
                sections.forEach(section => observer.observe(section));
            }, 1500);
        });
        
        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            nav.classList.toggle('scrolled', window.scrollY > 50);
        });
        
        // 导航链接点击事件
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 更新活动状态
                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
                
                // 平滑滚动
                const target = document.querySelector(this.getAttribute('href'));
                target.scrollIntoView({ behavior: 'smooth' });
            });
        });

                ";
